version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: greenbrain_local_postgres
    restart: unless-stopped
    env_file:
      - ./env/customer-local.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "55450:5432"
    volumes:
      - greenbrain_local_postgres_data:/var/lib/postgresql/data
      - ../../../client-runtime/sql/init:/docker-entrypoint-initdb.d:ro

  backend:
    build:
      context: ../../../apps/backend
      dockerfile: Dockerfile
    container_name: greenbrain_local_backend
    restart: unless-stopped
    env_file:
      - ./env/customer-local.env
    depends_on:
      - postgres
    ports:
      - "${LOCAL_BACKEND_PORT}:8000"

  frontend:
    image: nginx:alpine
    container_name: greenbrain_local_frontend
    restart: unless-stopped
    volumes:
      - ../../../apps/frontend/dist:/usr/share/nginx/html:ro
    ports:
      - "${LOCAL_FRONTEND_PORT}:80"

volumes:
  greenbrain_local_postgres_data:
