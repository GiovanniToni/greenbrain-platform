package_type: customer-local-runtime
package_version: 0.1.75
source_of_truth: greenbrain-platform
template_name: customer-local-template

components:
  frontend:
    source: apps/frontend
    delivery: built-static-files
  backend:
    source: apps/backend
    delivery: docker-build
  postgres:
    delivery: docker-image
  tunnel:
    provider: cloudflare-tunnel
    delivery: customer-side-config

rules:
  - dev is the canonical source
  - customer package is generated from template + current dev artifacts
  - customer instances must be updated through versioned releases
  - no manual drift on customer runtime unless documented

customer_runtime_model:
  data_mode: local-db-via-tunnel
  access_mode: local-runtime
  remote_mode: reverse-tunnel
