# GreenBrain Client Runtime — Local Stack
#
# Architecture:
#   greenbrain-platform (dev/master) → Supabase cloud DB + Supabase auth
#   client-runtime (this file)       → local PostgreSQL, no Supabase dependency
#
# Wave 7A status:
#   postgres   ✅ starts clean, runs init/01_bootstrap.sql on first boot
#   backend    ✅ built from apps/backend/Dockerfile, healthcheck enabled
#   frontend   ✅ client auth locale disponibile via backend JWT
#
# NOTE: business endpoints (sales, analytics, dashboard, etc.) return HTTP 500
#       on a fresh DB until Wave 7B applies full schema DDL.
#       /health and /health/db are always reliable.
#
# HOW TO USE:
#   # First run: build the backend image
#   docker-compose -f client-runtime/docker/docker-compose.yml build backend
#
#   # Start postgres + backend
#   docker-compose -f client-runtime/docker/docker-compose.yml up -d
#
#   # Wave 7B+: start with frontend (after auth migration)
#   docker-compose -f client-runtime/docker/docker-compose.yml \
#     --profile wave7-frontend up -d
#
# SETUP (one-time):
#   cp client-runtime/env/backend.env.template  client-runtime/env/backend.env
#   # set POSTGRES_PASSWORD in backend.env
#
version: "3.9"

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../sql/init:/docker-entrypoint-initdb.d:ro
    env_file:
      - ../env/backend.env
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-greenbrain} -d ${POSTGRES_DB:-greenbrain}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../../apps/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../env/backend.env
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    # Wave 7 — not started by default.
    # Activate with: --profile wave7-frontend
    # Auth client-runtime usa backend locale (/api/v1/auth/*), non Supabase
    # Unblocked by: docs/architecture/separation-boundary.md — gap ①
    profiles: [wave7-frontend]
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ../../apps/frontend:/app
    command: sh -c "npm install -q && npm run dev"
    env_file:
      - ../env/frontend.env
    ports:
      - "8081:8080"
    depends_on:
      - backend

volumes:
  postgres_data:
