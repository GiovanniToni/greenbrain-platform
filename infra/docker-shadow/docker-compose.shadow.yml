version: "3.9"

services:

  frontend_shadow:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ../../apps/frontend:/app
    command: sh -c "npm install && npm run dev"
    ports:
      - "5174:8080"

  backend_shadow:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ../../apps/backend:/app
    command: sh -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8001"
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://postgres:CHANGE_ME@localhost:5432/postgres?sslmode=disable
